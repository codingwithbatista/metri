# ==================== janela ====================
# canto da tela: top-right | top-left | bottom-right | bottom-left
position = top-right
# intervalo de atualização em segundos
refresh = 1.0
# largura do painel em px
width = 260
# distância da borda do monitor em px
margin = 20
# índice do monitor (0 = primário)
monitor = 0
# tipo de janela: desktop (recomendado — fica abaixo de todas as janelas, na
# área de trabalho; pode sumir ao clicar fora/show-desktop no KWin)
# | dock (fica acima das janelas normais no DDE; não some ao clicar fora)
window_type = desktop

# ==================== aparência ====================
font = "Sans, monospace"
font_size = 12
colors.background = rgba(20, 20, 24, 0.65)
colors.text = #e8e8e8
colors.accent = #61afef
colors.dim = #8a919f

# ==================== conteúdo ====================
# seções exibidas, na ordem desejada
sections = system, cpu, memory, disk, network, battery, processes
# interface usada na seção rede
network_iface = wlo1